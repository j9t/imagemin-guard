name: "Tests"

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node: ["lts/*", "current"]
    name: "Node ${{ matrix.node }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Lint"
        run: npm run lint
      - name: "Run tests"
        run: npm test

  # sharp and heic-decode ship native binaries
  test-macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: "Node lts/* (macOS)"
    runs-on: macos-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Run tests"
        run: npm test